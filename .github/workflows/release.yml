name: release

# The caller workflow. Building slivingdoc links static libgit2 through CGo,
# so every target needs its own libgit2 build. Five targets build natively;
# 32-bit Linux ARMv7 cross-builds on Ubuntu with the Debian hard-float
# toolchain and runs its smoke test through qemu-arm. The reusable pipeline in
# baalimago/simple-go-pipeline owns the matrix, release creation, and asset
# upload; this file supplies the native inputs.
#
# The pipeline is referenced by an immutable commit SHA, never a branch or a
# moving tag. The SHA below is the reviewed commit of the reusable-workflow
# change in baalimago/simple-go-pipeline (add prerelease support to
# release.yml and CGo-compatible inputs to validate.yml); scripts/
# check-release-ref.sh verifies the reference. Bump it deliberately with a
# reviewed commit; see
# worklogs/26-08-08-v1-implementation/simple-go-pipeline-release-proposal.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # setup-node pin for the publish job. Publish needs npm >= 11.5.1
  # (trusted publishing); Node 22 bundles npm 10.x, so pin Node 24 here.
  # The runtime floor is 22, tested in ci.yml.
  NODE_VERSION: "24.19.0"

jobs:
  release:
    uses: baalimago/simple-go-pipeline/.github/workflows/release.yml@0f3e945a5090f3b1bc4dfa5bf8a19db616c0a992
    with:
      go-version: "1.26.5"
      # project-name makes the pipeline produce the architecture-21 asset
      # grammar: slivingdoc-v<version>-<os>-<arch>[.exe].
      project-name: slivingdoc
      branch: master
      # The six supported targets of architecture section 21. `linux/arm` is
      # a statically linked ARMv7 hard-float binary for 32-bit Raspberry Pi OS.
      # Windows arm64 is deliberately absent until its native toolchain and
      # runner are proven.
      targets: |
        [
          {"os": "linux",   "arch": "amd64", "runner": "ubuntu-24.04"},
          {"os": "linux",   "arch": "arm",   "runner": "ubuntu-24.04"},
          {"os": "linux",   "arch": "arm64", "runner": "ubuntu-24.04-arm"},
          {"os": "darwin",  "arch": "amd64", "runner": "macos-15-intel"},
          {"os": "darwin",  "arch": "arm64", "runner": "macos-15"},
          {"os": "windows", "arch": "amd64", "runner": "windows-2025"}
        ]
      # One script builds pinned libgit2 per target. Linux amd64/arm64 use
      # native musl-gcc. The ARMv7 artifact uses Debian's hard-float cross
      # compiler, and qemu-arm executes its static smoke binary on the amd64
      # GitHub runner. Non-linux targets keep their native toolchains.
      native-setup-command: 'if [ "${TARGET_OS}" = linux ]; then sudo apt-get update -qq; if [ "${TARGET_ARCH}" = arm ]; then sudo apt-get install -y -qq gcc-arm-linux-gnueabihf qemu-user && CC=arm-linux-gnueabihf-gcc ./scripts/build-libgit2.sh; else sudo apt-get install -y -qq musl-tools && CC=musl-gcc ./scripts/build-libgit2.sh; fi; else ./scripts/build-libgit2.sh; fi'
      # The release version is injected by the linker; make build passes it.
      # BIN is the Makefile's build destination, so release builds write the
      # artifact directly at the pipeline's expected path ($TARGET_BINARY,
      # the architecture-21 asset name) instead of .build/slivingdoc.
      native-build-command: 'if [ "${TARGET_OS}" = linux ]; then if [ "${TARGET_ARCH}" = arm ]; then GOFLAGS="-tags=netgo,osusergo" GOOS=linux GOARCH=arm GOARM=7 CC=arm-linux-gnueabihf-gcc make build BIN="${TARGET_BINARY}" VERSION="${RELEASE_VERSION#v}" STATIC=1; else CC=musl-gcc make build BIN="${TARGET_BINARY}" VERSION="${RELEASE_VERSION#v}" STATIC=1; fi; else make build BIN="${TARGET_BINARY}" VERSION="${RELEASE_VERSION#v}"; fi'
      # Each target proves its own runtime dependency baseline. The pipeline
      # names platforms the way Go does (darwin), while the repo's checkers
      # use the OS names (macos); the substitution maps the one difference.
      dependency-check-command: os="${TARGET_OS/darwin/macos}"; ./scripts/check-deps-"${os}".sh "${TARGET_BINARY}"
      # The binary must start and report the injected version. The router has
      # no --version flag: a dash-prefixed argument is a skipped flag and a
      # bare invocation prints usage, so the smoke uses the version
      # subcommand. The ./ prefix is required because bash does not search
      # the working directory for executables.
      smoke-command: 'if [ "${TARGET_OS}" = linux ] && [ "${TARGET_ARCH}" = arm ]; then qemu-arm "./${TARGET_BINARY}" version; else ./"${TARGET_BINARY}" version; fi'
      # The strict SHA256SUMS grammar of architecture section 21. The
      # pipeline appends `dist/*` to this command itself, so the input is
      # the script path alone: a trailing `dist` argument would make the
      # script hash the directory and fail ("sha256sum: dist: Is a
      # directory").
      checksum-command: ./scripts/make-sha256sums.sh
      # NOTICE carries the MIT grant reference and the libgit2 notices; it
      # ships with every release and is covered by SHA256SUMS. The full MIT
      # text lives in LICENSE at the repository root.
      notice-file: NOTICE

  publish-npm:
    # Publishes the npm launcher after the GitHub release is fully assembled.
    # The reusable release job above completes only after `gh release create`
    # has uploaded every asset, so the prepublishOnly gate
    # (scripts/check-release.mjs) can never precede a complete release.
    #
    # Credentials: npm trusted publishing (OIDC). No token is stored in the
    # repository; npmjs.com accepts publishes only from this workflow file
    # (package slivingdoc -> Settings -> Trusted Publisher: owner
    # baalimago, repository slivingdoc, workflow release.yml, no
    # environment). The job must run on a GitHub-hosted runner and mint an
    # ID token (id-token: write). npm CLI 11.5.1 or later is required.
    name: Publish npm launcher
    needs: [release]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm CLI must support trusted publishing
        run: |
          npm_version="$(npm --version)"
          IFS=. read -r major minor patch <<< "$npm_version"
          if (( major < 11 || (major == 11 && (minor < 5 || (minor == 5 && patch < 1))) )); then
            echo "::error::npm ${npm_version} predates 11.5.1; trusted publishing (OIDC) requires npm >= 11.5.1" >&2
            exit 1
          fi
      - name: Publish to npm
        working-directory: npm/slivingdoc
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "::error::package.json version '${package_version}' does not match tag version '${tag_version}'; bump npm/slivingdoc/package.json in the release commit" >&2
            exit 1
          fi
          dist_tag="latest"
          core="${tag_version%%+*}"
          if [[ "$core" == *-* ]]; then
            dist_tag="next"
          fi
          echo "slivingdoc: publishing ${package_version} to the '${dist_tag}' dist-tag"
          # The prepublishOnly gate runs inside npm publish and blocks until
          # the GitHub release for this version is complete. Trusted
          # publishing (OIDC) supplies the credentials; no token exists.
          npm publish --tag "$dist_tag"
